[package]
name = "statika"
version = "0.3.3"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "A lightweight static file server for containerized deployments"

[[bin]]
name = "statika"
path = "src/main.rs"

[dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
